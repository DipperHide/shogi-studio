name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collector unit tests
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/test_tournaments.py
      - name: Install verified Godot 4.7.2
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum --check
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          echo /tmp/godot >> "$GITHUB_PATH"
      - name: Import assets
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --editor --import --quit
      - name: Rules, record parsing, reports and update recovery
        run: |
          set -euo pipefail
          for test in rules_test chessis_core_test report12_test story19_test report_chart22_test report_quality23_test tournament_sync20_test historic_games_test variation25_test evaluation26_test editor27_test motion_clock28_test openings29_test import30_test tournament31_test; do
            Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script "res://tests/$test.gd" -- --chessis20-regression
          done
          python scripts/check_rules_oracle.py --report review/app/chessis20/rules-oracle.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android record text decoder on the host JVM
        run: python scripts/test_import30_java.py
      - name: Replay interruption regression on a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri
          xvfb-run -a Godot_v4.7.2-stable_linux.x86_64 --path godot --audio-driver Dummy -- --unified-test --chessis24 --interrupt-only
      - name: Variation UI on a virtual display
        run: xvfb-run -a Godot_v4.7.2-stable_linux.x86_64 --path godot --audio-driver Dummy -- --unified-test --chessis25 --portable-variation
      - name: Opening preview UI on a virtual display
        run: xvfb-run -a Godot_v4.7.2-stable_linux.x86_64 --path godot --audio-driver Dummy -- --unified-test --chessis29
      - name: Analysis import UI on a virtual display
        run: |
          python scripts/prepare_import30_fixture.py
          xvfb-run -a Godot_v4.7.2-stable_linux.x86_64 --path godot --audio-driver Dummy -- --unified-test --chessis30 --portable-import
      - name: Tournament archive UI on a virtual display
        run: xvfb-run -a Godot_v4.7.2-stable_linux.x86_64 --path godot --audio-driver Dummy -- --unified-test --chessis31
      - name: Keep test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results
          path: |
            review/app/chessis20
            review/app/chessis22
            review/app/chessis23
            review/app/chessis24
            review/app/chessis25
            review/app/chessis26
            review/app/chessis27
            review/app/chessis28
            review/app/chessis29
            review/app/chessis30
            review/app/chessis31
